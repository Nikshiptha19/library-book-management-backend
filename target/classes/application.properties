spring.application.name=library-book-management
server.port=${SERVER_PORT:8081}

# MySQL configuration for real deployment
spring.datasource.url=jdbc:mysql://localhost:3306/library_book_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ammu96188}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=${JWT_SECRET:library-management-secret-key-1234567890}
jwt.expiration-ms=86400000

# Security defaults
spring.jackson.serialization.write-dates-as-timestamps=false
